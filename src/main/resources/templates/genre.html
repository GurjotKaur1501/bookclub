<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club - Genres</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">📚 Book Club</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/home">Home</a>
            <a class="nav-link" href="/books">Books</a>
            <a class="nav-link active" href="/genre">Genres</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="mb-4 text-center">Book Genres</h1>

    <!-- Show available genres -->
    <div th:if="${selectedGenre == null}">
        <p class="text-center mb-4">Select a genre to explore its books:</p>
        <div class="d-flex flex-wrap justify-content-center gap-3">
            <a th:each="g : ${genres}"
               th:href="'/genre?type=' + ${g}"
               class="btn btn-outline-primary btn-lg px-4"
               th:text="${g}">Genre</a>
        </div>
    </div>

    <!-- Show books for selected genre -->
    <div th:if="${selectedGenre}">
        <h3 class="text-center mb-4" th:text="'Books in ' + ${selectedGenre}">Genre</h3>

        <div th:if="${#lists.isEmpty(filteredBooks)}" class="text-center">
            <p class="text-muted">No books available in this genre.</p>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
             th:if="${!#lists.isEmpty(filteredBooks)}">
            <div class="col" th:each="b : ${filteredBooks}">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${b.title}">Title</h5>
                        <p class="card-text">
                            <strong>Author:</strong> <span th:text="${b.author}">Author</span><br/>
                            <strong>Genre:</strong> <span th:text="${b.genre}">Genre</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/genre" class="btn btn-secondary">Back to Genres</a>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2025 Book Club | Group: <span th:text="${group}">se.yrgo</span></p>
</footer>
</body>
</html>
