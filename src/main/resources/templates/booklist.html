<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Book Club - Recommended books</title>
</head>
<body>
<header>
    <h1>Recommended Books</h1>
</header>

<nav>
    <a href="/home">Home</a> |
    <a href="/books">Recommended books</a> |
    <a href="/genre">Genres</a>
</nav>

<section>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Genre</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.genre}">Genre</td>
        </tr>
        </tbody>
    </table>
</section>

<footer>
    <p>Group: <span th:text="${group}">se.yrgo</span></p>
</footer>
</body>
</html>
