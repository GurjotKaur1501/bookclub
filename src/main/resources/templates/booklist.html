<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Club - Book List</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/home">📚 Book Club</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/home">Home</a>
            <a class="nav-link active" href="/books">Books</a>
            <a class="nav-link" href="/genre">Genres</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <h1 class="mb-4 text-center">Recommended Books</h1>

    <div class="table-responsive">
        <table class="table table-striped table-bordered shadow-sm">
            <thead class="table-dark">
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.genre}">Genre</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="text-center mt-3">
        <a href="/genre" class="btn btn-primary">Browse by Genre</a>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 Book Club | Group: <span th:text="${group}">se.yrgo</span></p>
</footer>
</body>
</html>
